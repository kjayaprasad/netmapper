[package]
name = "netmapper"
version = "2.1.0"
edition = "2021"
rust-version = "1.88"
description = "Independent, bounded TCP and UDP network scanner"
readme = "README.md"

[[bin]]
name = "netmapper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive"] }
ipnet = "2"
mlua = { version = "0.12.1", default-features = false, features = ["lua54", "vendored", "serde", "error-send"] }
pnet_packet = "0.35"
pnet_transport = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
