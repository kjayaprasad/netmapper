[package]
name = "netmapper"
version = "0.1.0"
edition = "2021"
description = "Concurrent TCP port scanner for authorized network inventory"
readme = "README.md"

[[bin]]
name = "netmapper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
