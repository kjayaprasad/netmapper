name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Debian package
        run: ./scripts/build-deb.sh
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: netmapperv.1.1
          files: dist/*.deb